<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="日系青春风封面">
  <defs>
    <linearGradient id="jpy-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4fbf6"/>
      <stop offset="45%" stop-color="#d4efe4"/>
      <stop offset="100%" stop-color="#b0ddd0"/>
    </linearGradient>
    <radialGradient id="jpy-sun" cx="0.28" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#fffef5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fffef5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jpy-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4436"/>
      <stop offset="100%" stop-color="#482e24"/>
    </linearGradient>
    <linearGradient id="jpy-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e8d8"/>
      <stop offset="100%" stop-color="#f0d4bc"/>
    </linearGradient>
    <linearGradient id="jpy-uniform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4f8"/>
      <stop offset="100%" stop-color="#c8d8e4"/>
    </linearGradient>
    <linearGradient id="jpy-ribbon" x1="0" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#e88a9a"/>
      <stop offset="100%" stop-color="#cc6a7c"/>
    </linearGradient>
    <linearGradient id="jpy-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#jpy-bg)"/>
  <rect width="640" height="360" fill="url(#jpy-sun)"/>
  <!-- classroom window light -->
  <rect x="420" y="20" width="180" height="180" rx="4" fill="url(#jpy-window)"/>
  <rect x="420" y="20" width="180" height="180" rx="4" fill="none" stroke="#a8ccc0" stroke-width="3" opacity=".5"/>
  <line x1="510" y1="20" x2="510" y2="200" stroke="#a8ccc0" stroke-width="2" opacity=".4"/>
  <line x1="420" y1="110" x2="600" y2="110" stroke="#a8ccc0" stroke-width="2" opacity=".4"/>
  <!-- floating dust motes -->
  <circle cx="480" cy="80" r="3" fill="#fff" opacity=".7"/>
  <circle cx="530" cy="140" r="2.5" fill="#fff" opacity=".6"/>
  <circle cx="460" cy="180" r="2" fill="#fff" opacity=".5"/>
  <circle cx="560" cy="60" r="2" fill="#fff" opacity=".5"/>
  <!-- desk edge -->
  <rect x="0" y="300" width="640" height="60" fill="#c4a882" opacity=".35"/>
  <rect x="0" y="296" width="640" height="6" fill="#d4b894" opacity=".3"/>
  <!-- girl silhouette (backlit) -->
  <!-- hair back with wind-blown strands -->
  <path d="M240 130 Q236 80 300 72 Q364 80 360 130 Q368 190 358 260 Q350 280 340 290 L260 290 Q250 280 242 260 Q232 190 240 130 Z" fill="url(#jpy-hair)"/>
  <!-- wind-blown hair strand right -->
  <path d="M358 130 Q382 120 396 140 Q388 136 380 146 Q374 142 366 150" fill="url(#jpy-hair)" opacity=".8"/>
  <!-- neck -->
  <rect x="284" y="200" width="32" height="30" fill="url(#jpy-skin)"/>
  <!-- sailor collar -->
  <path d="M240 360 L260 250 Q280 232 300 230 Q320 232 340 250 L360 360 Z" fill="url(#jpy-uniform)"/>
  <!-- sailor collar flap -->
  <path d="M264 240 L300 276 L336 240 Q320 224 300 222 Q280 224 264 240 Z" fill="#b8cfe0"/>
  <path d="M264 240 L300 276 L336 240" fill="none" stroke="#8fb0c8" stroke-width="2" opacity=".5"/>
  <!-- ribbon -->
  <path d="M290 278 L310 278 L306 290 L294 290 Z" fill="url(#jpy-ribbon)"/>
  <circle cx="300" cy="282" r="4" fill="#d4708a"/>
  <!-- face (looking away, dreamy) -->
  <ellipse cx="300" cy="152" rx="48" ry="56" fill="url(#jpy-skin)"/>
  <!-- fringe (hime cut style) -->
  <path d="M252 136 Q256 94 300 88 Q344 94 348 136 Q336 112 300 108 Q264 112 252 136 Z" fill="url(#jpy-hair)"/>
  <!-- eye (looking sideways, bright) -->
  <ellipse cx="282" cy="152" rx="5" ry="7" fill="#4a3a30"/>
  <circle cx="283" cy="149" r="2" fill="#fff" opacity=".8"/>
  <!-- eyelash -->
  <path d="M276 144 Q282 141 288 145" stroke="#4a3a30" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="272" cy="166" rx="10" ry="5" fill="#f0b09a" opacity=".4"/>
  <!-- lips (small) -->
  <ellipse cx="300" cy="182" rx="7" ry="3.5" fill="#e8a090" opacity=".6"/>
  <!-- backlight rim on hair -->
  <path d="M348 130 Q356 180 350 250" stroke="#fffef0" stroke-width="3" opacity=".55" fill="none" stroke-linecap="round"/>
  <path d="M252 130 Q244 180 250 250" stroke="#fffef0" stroke-width="2" opacity=".3" fill="none" stroke-linecap="round"/>
  <!-- film grain overlay (subtle) -->
  <rect width="640" height="360" fill="#fff" opacity=".03"/>
  <!-- style label -->
  <rect x="0" y="318" width="640" height="42" fill="#2a4840" opacity=".28"/>
  <text x="320" y="346" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#f4fbf6" letter-spacing="4" opacity=".85">日系青春风</text>
</svg>
