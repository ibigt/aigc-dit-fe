<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="55%" stop-color="#1a0a2a"/>
      <stop offset="100%" stop-color="#2a0a3a"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a30" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0a0a1a" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#050510" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2a8a"/>
      <stop offset="50%" stop-color="#a040ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff66c4" stop-opacity=".25"/>
      <stop offset="60%" stop-color="#7a00ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#dusk)"/>
  <rect width="1600" height="900" fill="url(#haze)"/>
  <!-- distant skyline -->
  <g fill="#0e0e22">
    <rect x="0" y="280" width="90" height="420"/>
    <rect x="100" y="220" width="120" height="480"/>
    <rect x="230" y="180" width="80" height="520"/>
    <rect x="320" y="240" width="140" height="460"/>
    <rect x="470" y="160" width="100" height="540"/>
    <rect x="580" y="200" width="160" height="500"/>
    <rect x="750" y="140" width="110" height="560"/>
    <rect x="870" y="220" width="130" height="480"/>
    <rect x="1010" y="180" width="90" height="520"/>
    <rect x="1110" y="240" width="150" height="460"/>
    <rect x="1270" y="200" width="120" height="500"/>
    <rect x="1400" y="260" width="100" height="440"/>
    <rect x="1510" y="220" width="90" height="480"/>
  </g>
  <!-- building windows (scattered, dim) -->
  <g fill="#ffd966" opacity=".55">
    <rect x="20" y="320" width="6" height="10"/><rect x="40" y="350" width="6" height="10"/>
    <rect x="120" y="260" width="6" height="10"/><rect x="160" y="320" width="6" height="10"/><rect x="190" y="380" width="6" height="10"/>
    <rect x="250" y="220" width="6" height="10"/><rect x="280" y="290" width="6" height="10"/>
    <rect x="350" y="280" width="6" height="10"/><rect x="400" y="340" width="6" height="10"/><rect x="430" y="400" width="6" height="10"/>
    <rect x="490" y="200" width="6" height="10"/><rect x="540" y="280" width="6" height="10"/>
    <rect x="620" y="240" width="6" height="10"/><rect x="680" y="320" width="6" height="10"/><rect x="710" y="380" width="6" height="10"/>
    <rect x="780" y="180" width="6" height="10"/><rect x="820" y="260" width="6" height="10"/>
    <rect x="900" y="260" width="6" height="10"/><rect x="950" y="340" width="6" height="10"/>
    <rect x="1040" y="220" width="6" height="10"/><rect x="1080" y="320" width="6" height="10"/>
    <rect x="1140" y="280" width="6" height="10"/><rect x="1200" y="360" width="6" height="10"/>
    <rect x="1290" y="240" width="6" height="10"/><rect x="1340" y="320" width="6" height="10"/>
    <rect x="1430" y="300" width="6" height="10"/><rect x="1480" y="380" width="6" height="10"/>
  </g>
  <!-- giant neon billboard (holographic face) -->
  <g>
    <rect x="1180" y="180" width="280" height="220" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".9"/>
    <g opacity=".85">
      <ellipse cx="1320" cy="270" rx="80" ry="100" fill="#0a0a18"/>
      <ellipse cx="1320" cy="290" rx="55" ry="20" fill="#ff66c4" opacity=".3"/>
      <circle cx="1300" cy="250" r="6" fill="#00d4ff"/>
      <circle cx="1340" cy="250" r="6" fill="#00d4ff"/>
    </g>
  </g>
  <!-- street-level neon signs -->
  <g>
    <rect x="100" y="540" width="160" height="40" rx="2" fill="none" stroke="#ff2a8a" stroke-width="3" opacity=".95"/>
    <text x="180" y="568" text-anchor="middle" fill="#ff2a8a" font-size="20" font-family="sans-serif" font-weight="bold" style="filter: drop-shadow(0 0 6px #ff2a8a)">霓虹招牌</text>
    <rect x="380" y="560" width="120" height="32" rx="2" fill="none" stroke="#00d4ff" stroke-width="3" opacity=".9"/>
    <text x="440" y="582" text-anchor="middle" fill="#00d4ff" font-size="18" font-family="sans-serif" font-weight="bold" style="filter: drop-shadow(0 0 6px #00d4ff)">CYBER CAFE</text>
    <rect x="700" y="540" width="180" height="36" rx="2" fill="none" stroke="#a040ff" stroke-width="3" opacity=".9"/>
    <text x="790" y="566" text-anchor="middle" fill="#a040ff" font-size="18" font-family="sans-serif" font-weight="bold" style="filter: drop-shadow(0 0 6px #a040ff)">霓虹赛博 2099</text>
  </g>
  <!-- wet street reflection -->
  <rect y="700" width="1600" height="200" fill="url(#wet)"/>
  <g opacity=".4">
    <rect x="100" y="700" width="160" height="60" fill="#ff2a8a" opacity=".18"/>
    <rect x="380" y="710" width="120" height="50" fill="#00d4ff" opacity=".18"/>
    <rect x="700" y="700" width="180" height="60" fill="#a040ff" opacity=".18"/>
  </g>
  <!-- lone figure (photographic vibe, no visor) -->
  <g transform="translate(720,520)">
    <ellipse cx="80" cy="50" rx="22" ry="28" fill="#d4b896"/>
    <path d="M50 80 Q80 76 110 80 L116 180 L44 180 Z" fill="#1a1a2a"/>
    <path d="M52 80 Q80 76 108 80 L114 200 L46 200 Z" fill="#0e0e22"/>
  </g>
  <!-- rain streaks -->
  <g stroke="#aaccff" stroke-width="1" opacity=".18">
    <line x1="80" y1="0" x2="74" y2="80"/>
    <line x1="220" y1="40" x2="214" y2="120"/>
    <line x1="360" y1="20" x2="354" y2="100"/>
    <line x1="500" y1="60" x2="494" y2="140"/>
    <line x1="640" y1="20" x2="634" y2="100"/>
    <line x1="780" y1="50" x2="774" y2="130"/>
    <line x1="920" y1="10" x2="914" y2="90"/>
    <line x1="1060" y1="40" x2="1054" y2="120"/>
    <line x1="1200" y1="20" x2="1194" y2="100"/>
    <line x1="1340" y1="50" x2="1334" y2="130"/>
    <line x1="1480" y1="20" x2="1474" y2="100"/>
  </g>
  <text x="800" y="850" text-anchor="middle" fill="#ff66c4" font-size="52" font-family="sans-serif" font-weight="bold" style="filter: drop-shadow(0 0 12px #00d4ff)">霓虹赛博风</text>
</svg>
