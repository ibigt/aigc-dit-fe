<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="美式复古风封面">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d9a8"/>
      <stop offset="45%" stop-color="#eaa96b"/>
      <stop offset="100%" stop-color="#c97f4e"/>
    </linearGradient>
    <radialGradient id="ar-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9b8"/>
      <stop offset="70%" stop-color="#ffbe6e"/>
      <stop offset="100%" stop-color="#ffbe6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ar-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2cdb0"/>
      <stop offset="100%" stop-color="#dbae8d"/>
    </linearGradient>
    <linearGradient id="ar-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b3a22"/>
      <stop offset="100%" stop-color="#4a2614"/>
    </linearGradient>
    <linearGradient id="ar-jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#6e431f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ar-bg)"/>
  <!-- retro striped sun -->
  <circle cx="320" cy="170" r="88" fill="url(#ar-sun)"/>
  <g fill="#eaa96b">
    <rect x="222" y="150" width="196" height="7"/>
    <rect x="228" y="168" width="184" height="8"/>
    <rect x="234" y="188" width="172" height="9"/>
    <rect x="240" y="210" width="160" height="10"/>
    <rect x="246" y="234" width="148" height="12"/>
  </g>
  <!-- distant hills -->
  <path d="M0 258 Q120 232 240 254 T480 250 T640 260 L640 360 L0 360 Z" fill="#a96a3e" opacity=".35"/>
  <!-- vintage car silhouette -->
  <g fill="#5c3620" opacity=".85">
    <path d="M60 300 Q64 284 92 280 L146 278 Q176 278 196 292 L212 300 Z"/>
    <circle cx="100" cy="302" r="12"/>
    <circle cx="180" cy="302" r="12"/>
  </g>
  <!-- diner + neon sign on the right -->
  <g fill="#5c3620" opacity=".8">
    <rect x="470" y="238" width="130" height="64"/>
    <rect x="530" y="204" width="10" height="36"/>
    <circle cx="535" cy="198" r="14" fill="none" stroke="#ffdf8e" stroke-width="4"/>
  </g>
  <!-- character portrait -->
  <path d="M270 208 L270 250 L228 280 L372 280 L330 250 L330 208 Z" fill="url(#ar-skin)"/>
  <!-- suede / denim jacket -->
  <path d="M198 360 L232 272 Q262 252 300 248 Q338 252 368 272 L402 360 Z" fill="url(#ar-jacket)"/>
  <path d="M198 360 L232 272 Q250 258 268 252 L286 360 Z" fill="#7a4e2c" opacity=".5"/>
  <!-- curly hair back -->
  <path d="M232 156 Q230 96 300 88 Q370 96 368 156 Q378 214 368 282 L232 282 Q222 214 232 156 Z" fill="url(#ar-hair)"/>
  <!-- face -->
  <ellipse cx="300" cy="160" rx="50" ry="60" fill="url(#ar-skin)"/>
  <!-- curly fringe -->
  <circle cx="262" cy="122" r="16" fill="url(#ar-hair)"/>
  <circle cx="288" cy="112" r="18" fill="url(#ar-hair)"/>
  <circle cx="316" cy="112" r="18" fill="url(#ar-hair)"/>
  <circle cx="340" cy="124" r="15" fill="url(#ar-hair)"/>
  <!-- soft smile -->
  <path d="M272 158 L286 158" stroke="#6b4630" stroke-width="2" stroke-linecap="round"/>
  <path d="M314 158 L328 158" stroke="#6b4630" stroke-width="2" stroke-linecap="round"/>
  <path d="M290 190 Q300 196 310 190" stroke="#b06a4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- warm rim light -->
  <path d="M348 126 Q354 168 348 226" stroke="#ffd98e" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
  <!-- film grain dots -->
  <g fill="#8a5a34" opacity=".18">
    <circle cx="80" cy="80" r="1.6"/><circle cx="180" cy="120" r="1.3"/><circle cx="520" cy="90" r="1.6"/>
    <circle cx="560" cy="150" r="1.2"/><circle cx="120" cy="180" r="1.4"/><circle cx="480" cy="180" r="1.3"/>
    <circle cx="220" cy="70" r="1.2"/><circle cx="600" cy="110" r="1.4"/><circle cx="40" cy="140" r="1.3"/>
  </g>
  <!-- style label -->
  <rect x="0" y="318" width="640" height="42" fill="#2e1a0c" opacity=".4"/>
  <text x="320" y="346" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#fff3df" letter-spacing="4" opacity=".9">美式复古风</text>
</svg>
