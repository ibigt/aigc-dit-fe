    <rect x="200" y="120" width="160" height="680"/>
    <rect x="380" y="180" width="100" height="620"/>
    <rect x="500" y="80" width="180" height="720"/>
    <rect x="920" y="150" width="140" height="650"/>
    <rect x="1080" y="100" width="160" height="700"/>
    <rect x="1260" y="220" width="120" height="580"/>
    <rect x="1400" y="160" width="140" height="640"/>
