    <rect x="80" y="290" width="12" height="18"/><rect x="140" y="290" width="12" height="18"/>
    <rect x="220" y="160" width="14" height="20"/><rect x="260" y="160" width="14" height="20"/><rect x="300" y="160" width="14" height="20"/>
    <rect x="220" y="220" width="14" height="20"/><rect x="280" y="220" width="14" height="20"/><rect x="320" y="220" width="14" height="20"/>
    <rect x="520" y="120" width="16" height="22"/><rect x="560" y="120" width="16" height="22"/><rect x="600" y="120" width="16" height="22"/><rect x="640" y="120" width="16" height="22"/>
    <rect x="520" y="180" width="16" height="22"/><rect x="580" y="180" width="16" height="22"/><rect x="640" y="180" width="16" height="22"/>
    <rect x="940" y="190" width="14" height="20"/><rect x="980" y="190" width="14" height="20"/><rect x="1020" y="190" width="14" height="20"/>
    <rect x="1100" y="140" width="14" height="20"/><rect x="1140" y="140" width="14" height="20"/><rect x="1180" y="140" width="14" height="20"/><rect x="1220" y="140" width="14" height="20"/>
    <rect x="1420" y="200" width="14" height="20"/><rect x="1460" y="200" width="14" height="20"/><rect x="1500" y="200" width="14" height="20"/>
  </g>
  <!-- neon signs -->
  <g>
    <rect x="240" y="320" width="80" height="34" rx="4" fill="none" stroke="url(#neon1)" stroke-width="3"/>
    <text x="280" y="344" text-anchor="middle" fill="#ff66c4" font-size="18" font-family="sans-serif" font-weight="bold">CYBER</text>
    <rect x="960" y="280" width="100" height="36" rx="4" fill="none" stroke="url(#neon2)" stroke-width="3"/>
    <text x="1010" y="305" text-anchor="middle" fill="#00e5ff" font-size="18" font-family="sans-serif" font-weight="bold">NEON 2099</text>
  </g>
  <!-- figure with cyber visor -->
  <g transform="translate(720,300)">
    <ellipse cx="80" cy="60" rx="36" ry="42" fill="#d0c4e8"/>
    <rect x="36" y="52" width="88" height="22" rx="11" fill="#0a0a1a" stroke="#00e5ff" stroke-width="2"/>
    <rect x="44" y="56" width="72" height="14" rx="7" fill="#ff0080" opacity=".85"/>
    <path d="M20 104 Q80 94 140 104 L170 500 Q80 540 -10 500 Z" fill="url(#neon1)"/>
    <path d="M40 104 Q80 96 120 104 L120 420 Q80 400 40 420 Z" fill="#1a1140" opacity=".5"/>
  </g>
  <text x="800" y="820" text-anchor="middle" fill="#00e5ff" font-size="52" font-family="sans-serif" font-weight="bold" style="filter: drop-shadow(0 0 12px #ff0080)">赛博朋克风</text>
</svg>
