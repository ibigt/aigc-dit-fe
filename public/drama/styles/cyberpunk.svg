<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="55%" stop-color="#1a1140"/>
      <stop offset="100%" stop-color="#2a0a3a"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#7a00ff"/>
    </linearGradient>
    <linearGradient id="neon2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <!-- rain -->
  <g stroke="#88aaff" stroke-width="1" opacity=".25">
    <line x1="100" y1="0" x2="90" y2="80"/>
    <line x1="180" y1="40" x2="170" y2="120"/>
    <line x1="260" y1="10" x2="250" y2="90"/>
    <line x1="340" y1="60" x2="330" y2="140"/>
    <line x1="420" y1="20" x2="410" y2="100"/>
    <line x1="500" y1="70" x2="490" y2="150"/>
    <line x1="580" y1="30" x2="570" y2="110"/>
    <line x1="660" y1="50" x2="650" y2="130"/>
    <line x1="740" y1="15" x2="730" y2="95"/>
    <line x1="820" y1="55" x2="810" y2="135"/>
    <line x1="900" y1="25" x2="890" y2="105"/>
    <line x1="980" y1="65" x2="970" y2="145"/>
    <line x1="1060" y1="10" x2="1050" y2="90"/>
    <line x1="1140" y1="45" x2="1130" y2="125"/>
    <line x1="1220" y1="20" x2="1210" y2="100"/>
