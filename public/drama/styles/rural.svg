<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="60%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="320" height="200" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="250" cy="55" r="28" fill="url(#sun)" opacity="0.9"/>

  <!-- Far mountains -->
  <path d="M0,120 L40,90 L80,110 L120,80 L170,105 L210,85 L260,110 L320,90 L320,140 L0,140 Z" fill="url(#mountainFar)" opacity="0.7"/>

  <!-- Near mountains -->
  <path d="M0,140 L30,115 L70,135 L110,100 L160,125 L200,105 L250,130 L300,115 L320,125 L320,160 L0,160 Z" fill="url(#mountainNear)"/>

  <!-- Ground / field -->
  <rect y="140" width="320" height="60" fill="url(#ground)"/>

  <!-- Rice paddy terrace lines -->
  <path d="M0,155 Q80,150 160,158 T320,155" stroke="#365314" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M0,170 Q100,165 200,172 T320,170" stroke="#365314" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M0,185 Q120,180 240,187 T320,186" stroke="#365314" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Rural house (left) -->
  <g transform="translate(40,110)">
    <polygon points="0,30 20,10 40,30" fill="#7c2d12"/>
    <rect x="4" y="30" width="32" height="25" fill="#d6a77a"/>
    <rect x="16" y="38" width="8" height="17" fill="#7c2d12"/>
    <rect x="8" y="36" width="6" height="6" fill="#fef3c7" stroke="#7c2d12" stroke-width="0.5"/>
    <rect x="26" y="36" width="6" height="6" fill="#fef3c7" stroke="#7c2d12" stroke-width="0.5"/>
  </g>

  <!-- Rural house (right, slightly larger) -->
  <g transform="translate(220,100)">
    <polygon points="0,35 25,10 50,35" fill="#7c2d12"/>
    <rect x="5" y="35" width="40" height="30" fill="#c9956a"/>
    <rect x="20" y="45" width="10" height="20" fill="#7c2d12"/>
    <rect x="10" y="42" width="7" height="7" fill="#fef3c7" stroke="#7c2d12" stroke-width="0.5"/>
    <rect x="33" y="42" width="7" height="7" fill="#fef3c7" stroke="#7c2d12" stroke-width="0.5"/>
    <!-- Chimney -->
    <rect x="36" y="12" width="5" height="10" fill="#78350f"/>
    <!-- Smoke -->
    <circle cx="38.5" cy="9" r="3" fill="#fef3c7" opacity="0.7"/>
    <circle cx="40" cy="5" r="2.5" fill="#fef3c7" opacity="0.5"/>
  </g>

  <!-- Tree left -->
  <g transform="translate(15,115)">
    <rect x="6" y="20" width="4" height="15" fill="#7c2d12"/>
    <circle cx="8" cy="18" r="12" fill="#166534"/>
    <circle cx="3" cy="20" r="8" fill="#16a34a"/>
    <circle cx="13" cy="20" r="8" fill="#16a34a"/>
    <circle cx="8" cy="12" r="7" fill="#22c55e"/>
  </g>

  <!-- Tree right -->
  <g transform="translate(285,120)">
    <rect x="5" y="18" width="3" height="12" fill="#7c2d12"/>
    <circle cx="6.5" cy="16" r="10" fill="#166534"/>
    <circle cx="2" cy="18" r="7" fill="#16a34a"/>
    <circle cx="11" cy="18" r="7" fill="#16a34a"/>
  </g>

  <!-- Foreground wheat / crop elements -->
  <g stroke="#eab308" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M70,195 Q72,180 75,195 Q78,175 81,195"/>
    <path d="M90,196 Q92,182 95,196 Q98,178 101,196"/>
    <path d="M130,195 Q132,180 135,195 Q138,174 141,195"/>
    <path d="M190,196 Q192,183 195,196 Q198,178 201,196"/>
    <path d="M260,195 Q262,181 265,195 Q268,176 271,195"/>
  </g>

  <!-- Bird silhouettes -->
  <path d="M100,45 Q104,42 108,45 Q112,42 116,45" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M140,35 Q143,33 146,35 Q149,33 152,35" stroke="#1f2937" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Title text -->
  <text x="160" y="192" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#3f2d14" letter-spacing="2">乡土漫画风</text>
</svg>
