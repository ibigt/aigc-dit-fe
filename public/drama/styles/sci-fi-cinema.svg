<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="科技电影风封面">
  <defs>
    <linearGradient id="sfc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="55%" stop-color="#10263e"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <radialGradient id="sfc-haze" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0%" stop-color="#2ad4ff" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#0a84ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sfc-streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ad4ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5ce1ff" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#ffb35c" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#ff8a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sfc-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c2a6"/>
      <stop offset="100%" stop-color="#c99b7d"/>
    </linearGradient>
    <linearGradient id="sfc-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2430"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="sfc-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24384e"/>
      <stop offset="100%" stop-color="#16243a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sfc-bg)"/>
  <rect width="640" height="360" fill="url(#sfc-haze)"/>
  <!-- anamorphic lens streak -->
  <rect x="60" y="86" width="520" height="3" rx="1.5" fill="url(#sfc-streak)"/>
  <rect x="200" y="86" width="240" height="1.4" fill="#eaffff" opacity=".6"/>
  <!-- hologram HUD rings -->
  <circle cx="510" cy="150" r="56" fill="none" stroke="#3fd4ff" stroke-width="1" opacity=".35"/>
  <circle cx="510" cy="150" r="40" fill="none" stroke="#3fd4ff" stroke-width="1" opacity=".25" stroke-dasharray="6 8"/>
  <path d="M510 96 L510 86 M556 150 L566 150 M510 204 L510 214 M464 150 L454 150" stroke="#3fd4ff" stroke-width="1.5" opacity=".5"/>
  <!-- futuristic skyline -->
  <g fill="#081020">
    <rect x="0" y="250" width="70" height="110"/>
    <rect x="80" y="222" width="54" height="138"/>
    <rect x="144" y="240" width="40" height="120"/>
    <rect x="560" y="236" width="46" height="124"/>
    <rect x="612" y="256" width="28" height="104"/>
  </g>
  <g fill="#3fd4ff" opacity=".5">
    <rect x="90" y="232" width="6" height="4"/><rect x="104" y="244" width="6" height="4"/>
    <rect x="118" y="232" width="6" height="4"/><rect x="90" y="260" width="6" height="4"/>
    <rect x="150" y="252" width="6" height="4"/><rect x="164" y="268" width="6" height="4"/>
    <rect x="570" y="248" width="6" height="4"/><rect x="584" y="264" width="6" height="4"/>
    <rect x="598" y="248" width="6" height="4"/><rect x="570" y="280" width="6" height="4"/>
  </g>
  <!-- volumetric light beams -->
  <path d="M300 0 L360 0 L520 360 L440 360 Z" fill="#2ad4ff" opacity=".05"/>
  <path d="M120 0 L150 0 L260 360 L200 360 Z" fill="#ffb35c" opacity=".04"/>
  <!-- character silhouette -->
  <path d="M270 210 L270 252 L226 282 L374 282 L330 252 L330 210 Z" fill="url(#sfc-skin)"/>
  <!-- suit shoulders -->
  <path d="M196 360 L230 274 Q262 252 300 248 Q338 252 370 274 L404 360 Z" fill="url(#sfc-suit)"/>
  <!-- collar glow line -->
  <path d="M262 262 L300 288 L338 262" fill="none" stroke="#3fd4ff" stroke-width="2" opacity=".6"/>
  <!-- hair back -->
  <path d="M236 158 Q236 100 300 92 Q364 100 364 158 Q374 216 366 284 L234 284 Q226 216 236 158 Z" fill="url(#sfc-hair)"/>
  <!-- face -->
  <ellipse cx="300" cy="160" rx="50" ry="60" fill="url(#sfc-skin)"/>
  <!-- fringe -->
  <path d="M252 142 Q258 102 300 96 Q342 102 348 142 Q336 120 300 116 Q264 120 252 142 Z" fill="url(#sfc-hair)"/>
  <!-- calm eyes -->
  <path d="M270 160 L284 160" stroke="#5c4030" stroke-width="2" stroke-linecap="round"/>
  <path d="M316 160 L330 160" stroke="#5c4030" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="300" cy="190" rx="9" ry="4" fill="#a06650" opacity=".7"/>
  <!-- cool rim light on face and hair -->
  <path d="M348 128 Q354 168 348 224" stroke="#7ce4ff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M252 128 Q246 168 252 224" stroke="#ffb35c" stroke-width="2" fill="none" opacity=".3" stroke-linecap="round"/>
  <!-- style label -->
  <rect x="0" y="318" width="640" height="42" fill="#04101e" opacity=".45"/>
  <text x="320" y="346" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#dff6ff" letter-spacing="4" opacity=".9">科技电影风</text>
</svg>
