<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a1f"/>
      <stop offset="60%" stop-color="#0d1b3d"/>
      <stop offset="100%" stop-color="#1a2b5a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa7b8"/>
      <stop offset="100%" stop-color="#4a5a70"/>
    </linearGradient>
    <linearGradient id="mecha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c45c2a"/>
      <stop offset="100%" stop-color="#7a3014"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#space)"/>
  <!-- stars -->
  <g fill="white">
    <circle cx="100" cy="80" r="1.5" opacity=".9"/>
    <circle cx="220" cy="50" r="1" opacity=".7"/>
    <circle cx="340" cy="120" r="1.8" opacity=".8"/>
    <circle cx="480" cy="60" r="1" opacity=".6"/>
    <circle cx="620" cy="100" r="1.5" opacity=".9"/>
    <circle cx="760" cy="40" r="1" opacity=".7"/>
    <circle cx="900" cy="90" r="1.8" opacity=".8"/>
    <circle cx="1040" cy="50" r="1" opacity=".6"/>
    <circle cx="1180" cy="110" r="1.5" opacity=".9"/>
    <circle cx="1320" cy="70" r="1" opacity=".7"/>
    <circle cx="1460" cy="130" r="1.8" opacity=".8"/>
    <circle cx="160" cy="200" r="1" opacity=".5"/>
    <circle cx="420" cy="180" r="1.2" opacity=".6"/>
    <circle cx="680" cy="220" r="1" opacity=".5"/>
    <circle cx="1100" cy="190" r="1.4" opacity=".7"/>
    <circle cx="1400" cy="210" r="1" opacity=".5"/>
  </g>
  <!-- distant planet -->
  <circle cx="1280" cy="180" r="70" fill="#6a4a9a"/>
  <circle cx="1300" cy="160" r="24" fill="#9b7ec2" opacity=".45"/>
  <ellipse cx="1280" cy="180" rx="110" ry="12" fill="none" stroke="#9b7ec2" stroke-width="3" opacity=".6"/>
  <!-- spaceship -->
  <g transform="translate(200,280)">
    <path d="M0 80 Q200 -20 420 80 Q380 140 Q200 160 Q20 140 Z" fill="url(#hull)"/>
    <ellipse cx="210" cy="70" rx="70" ry="22" fill="#6fb8ff" opacity=".8"/>
    <rect x="80" y="120" width="16" height="40" fill="#4a5a70"/>
    <rect x="150" y="120" width="16" height="40" fill="#4a5a70"/>
    <rect x="260" y="120" width="16" height="40" fill="#4a5a70"/>
    <rect x="330" y="120" width="16" height="40" fill="#4a5a70"/>
  </g>
  <!-- mecha robot -->
  <g transform="translate(680,380)">
    <rect x="50" y="0" width="80" height="90" rx="12" fill="url(#mecha)"/>
    <rect x="60" y="20" width="60" height="30" rx="6" fill="#1a2b5a"/>
    <rect x="68" y="26" width="44" height="18" rx="4" fill="#6fb8ff"/>
    <rect x="30" y="90" width="120" height="160" rx="10" fill="url(#mecha)"/>
    <rect x="50" y="110" width="80" height="10" fill="#1a2b5a"/>
    <rect x="50" y="140" width="80" height="10" fill="#1a2b5a"/>
    <rect x="0" y="100" width="28" height="90" rx="8" fill="url(#mecha)"/>
    <rect x="152" y="100" width="28" height="90" rx="8" fill="url(#mecha)"/>
    <rect x="40" y="250" width="36" height="130" rx="8" fill="url(#mecha)"/>
    <rect x="104" y="250" width="36" height="130" rx="8" fill="url(#mecha)"/>
  </g>
  <!-- space station rings -->
  <g transform="translate(1150,500)" opacity=".85">
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="#9aa7b8" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="100" ry="28" fill="none" stroke="#6fb8ff" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#c45c2a"/>
  </g>
  <text x="800" y="820" text-anchor="middle" fill="#6fb8ff" font-size="52" font-family="sans-serif" font-weight="bold">未来科幻风</text>
</svg>
