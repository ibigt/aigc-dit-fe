<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e6d4"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b3a2f"/>
      <stop offset="100%" stop-color="#5c241c"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c44536"/>
      <stop offset="100%" stop-color="#7a2820"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- distant mountains -->
  <path d="M0 620 Q200 480 400 580 T800 540 T1200 590 T1600 520 L1600 900 L0 900 Z" fill="#a88b6e" opacity=".55"/>
  <path d="M0 700 Q240 580 480 660 T960 620 T1440 670 T1600 640 L1600 900 L0 900 Z" fill="#7d6448" opacity=".65"/>
  <!-- pavilion -->
  <g transform="translate(900,280)">
    <rect x="80" y="150" width="240" height="200" fill="#c9a67a"/>
    <rect x="70" y="140" width="260" height="20" fill="#8b5a3c"/>
    <path d="M50 140 Q200 40 350 140 Z" fill="url(#roof)"/>
    <path d="M30 140 L200 20 L370 140 Z" fill="#5c241c" opacity=".35"/>
    <rect x="160" y="200" width="80" height="150" fill="#5c241c" opacity=".45"/>
    <line x1="200" y1="40" x2="200" y2="0" stroke="#5c241c" stroke-width="4"/>
  </g>
  <!-- figure in hanfu -->
  <g transform="translate(480,320)">
    <ellipse cx="120" cy="90" rx="48" ry="54" fill="#f4d9bf"/>
    <path d="M40 140 Q120 130 200 140 L240 520 Q120 560 0 520 Z" fill="url(#dress)"/>
    <path d="M40 140 Q120 130 200 140 L200 480 Q120 450 40 480 Z" fill="#e9c77a" opacity=".55"/>
    <path d="M72 52 Q90 20 120 12 Q150 20 168 52 Q160 36 120 28 Q80 36 72 52 Z" fill="#2a1a12"/>
    <path d="M96 76 Q108 68 120 72 Q132 68 144 76" stroke="#3a2820" stroke-width="3" fill="none"/>
    <circle cx="104" cy="100" r="4" fill="#3a2820"/>
    <circle cx="136" cy="100" r="4" fill="#3a2820"/>
    <path d="M112 122 Q120 128 128 122" stroke="#a0522d" stroke-width="3" fill="none"/>
  </g>
  <!-- willow branches -->
  <g stroke="#4a7c3a" stroke-width="2" fill="none" opacity=".7">
    <path d="M0 0 Q40 200 20 400"/>
    <path d="M40 0 Q80 180 60 380"/>
    <path d="M80 0 Q120 220 100 420"/>
    <path d="M120 0 Q160 200 140 400"/>
  </g>
  <text x="800" y="820" text-anchor="middle" fill="#5c241c" font-size="52" font-family="serif" font-weight="bold">古装漫画风</text>
</svg>
