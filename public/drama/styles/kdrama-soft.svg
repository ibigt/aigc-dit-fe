<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="韩剧柔光风封面">
  <defs>
    <linearGradient id="kds-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe8d8"/>
      <stop offset="40%" stop-color="#f5cdb2"/>
      <stop offset="100%" stop-color="#e8a97e"/>
    </linearGradient>
    <radialGradient id="kds-glow" cx="0.7" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#fff5ea" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff5ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kds-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a2e"/>
      <stop offset="100%" stop-color="#3a221a"/>
    </linearGradient>
    <linearGradient id="kds-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7dcc4"/>
      <stop offset="100%" stop-color="#eec4a2"/>
    </linearGradient>
    <linearGradient id="kds-coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ede4"/>
      <stop offset="100%" stop-color="#ddd0c2"/>
    </linearGradient>
    <linearGradient id="kds-bokeh1" x1="0" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f9d4a8" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#f9d4a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#kds-bg)"/>
  <rect width="640" height="360" fill="url(#kds-glow)"/>
  <!-- bokeh circles -->
  <circle cx="80" cy="60" r="28" fill="#f9d4a8" opacity=".4"/>
  <circle cx="160" cy="40" r="16" fill="#fff" opacity=".35"/>
  <circle cx="580" cy="120" r="22" fill="#f9d4a8" opacity=".35"/>
  <circle cx="540" cy="50" r="12" fill="#fff" opacity=".4"/>
  <!-- city skyline silhouette -->
  <rect x="0" y="260" width="640" height="100" fill="#c9966a" opacity=".35"/>
  <rect x="40" y="230" width="48" height="80" fill="#b8855c" opacity=".3"/>
  <rect x="120" y="250" width="36" height="60" fill="#b8855c" opacity=".25"/>
  <rect x="500" y="240" width="56" height="70" fill="#b8855c" opacity=".28"/>
  <rect x="590" y="258" width="30" height="52" fill="#b8855c" opacity=".2"/>
  <!-- woman portrait silhouette -->
  <ellipse cx="300" cy="250" rx="100" ry="110" fill="#d4977a" opacity=".18"/>
  <!-- hair back -->
  <path d="M230 160 Q230 100 300 90 Q370 100 370 160 Q380 220 372 290 L228 290 Q220 220 230 160 Z" fill="url(#kds-hair)"/>
  <!-- neck & shoulders -->
  <path d="M270 210 L270 250 L230 280 L370 280 L330 250 L330 210 Z" fill="url(#kds-skin)"/>
  <!-- coat / shoulders -->
  <path d="M200 360 L230 275 Q260 255 300 252 Q340 255 370 275 L400 360 Z" fill="url(#kds-coat)"/>
  <!-- face -->
  <ellipse cx="300" cy="160" rx="52" ry="62" fill="url(#kds-skin)"/>
  <!-- fringe -->
  <path d="M248 140 Q252 98 300 92 Q348 98 352 140 Q340 118 300 114 Q260 118 248 140 Z" fill="url(#kds-hair)"/>
  <!-- soft blush -->
  <ellipse cx="272" cy="172" rx="12" ry="7" fill="#f2b490" opacity=".35"/>
  <ellipse cx="328" cy="172" rx="12" ry="7" fill="#f2b490" opacity=".35"/>
  <!-- eyes closed (dreamy) -->
  <path d="M268 160 Q274 156 280 160" stroke="#8a5c3c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M320 160 Q326 156 332 160" stroke="#8a5c3c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- lips -->
  <ellipse cx="300" cy="192" rx="10" ry="5" fill="#e0806a" opacity=".7"/>
  <!-- warm rim light on hair -->
  <path d="M352 140 Q358 180 350 240" stroke="#f9c48a" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
  <path d="M248 140 Q242 180 250 240" stroke="#f9c48a" stroke-width="2" fill="none" opacity=".3" stroke-linecap="round"/>
  <!-- style label -->
  <rect x="0" y="318" width="640" height="42" fill="#1a120a" opacity=".35"/>
  <text x="320" y="346" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#fff8f0" letter-spacing="4" opacity=".85">韩剧柔光风</text>
</svg>
